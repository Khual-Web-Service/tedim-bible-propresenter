name: Release

# Publishes the double-click installers when a version tag is pushed:
#
#   git tag v1.0 && git push origin v1.0
#
# The .rvbible packages are NOT built here. They are built on a Mac with
# ProPresenter, where a real DBL 2.1 template exists, and committed under
# dist/ — see tools/make-pkg.sh. This workflow only wraps and attaches them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # pkgbuild and productbuild are macOS-only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the committed packages are there
        run: |
          count=$(ls dist/*.rvbible 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No dist/*.rvbible in the repository." >&2
            echo "Build them on a Mac with ProPresenter and commit dist/ before tagging." >&2
            exit 1
          fi
          echo "Found $count package(s):"
          ls -la dist/*.rvbible
          # A package ProPresenter accepts has its books under release/USX_1/.
          for package in dist/*.rvbible; do
            unzip -l "$package" | grep -q 'release/USX_1/' \
              || { echo "$package has the wrong layout" >&2; exit 1; }
          done

      - name: Build TedimBibles.pkg
        run: tools/make-pkg.sh "${GITHUB_REF_NAME#v}"

      - name: Build the Windows zip
        run: |
          staging=windows/TedimBibles-windows
          mkdir -p "$staging/tools"
          cp tools/Install.bat "$staging/Install.bat"
          cp tools/install-windows.ps1 "$staging/tools/"
          cp bibles.json "$staging/"
          cp -R bibles "$staging/bibles"
          # The repository keeps both USX/ and the legacy USX_1/; the Windows
          # install reads USX/, so the zip does not carry the copy twice.
          rm -rf "$staging"/bibles/*/USX_1
          (cd windows && zip -qr ../dist/TedimBibles-windows.zip TedimBibles-windows)
          ls -la dist/TedimBibles-windows.zip

      - name: Attach everything to the release
        # A manual run builds and checks the installers; only a tag publishes.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/TedimBibles.pkg \
            dist/TedimBibles-windows.zip \
            dist/*.rvbible
